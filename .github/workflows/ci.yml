name: academy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required license evidence
        run: test -s LICENSE && test -s docs/licenses/phaser-template-MIT.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
